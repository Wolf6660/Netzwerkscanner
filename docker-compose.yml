services:
  netscan:
    build: .
    container_name: netscan
    # Für ARP/MAC-Erkennung im lokalen Netz der Synology erforderlich.
    # Die Anwendung bleibt über Port 22222 der Synology erreichbar.
    network_mode: host
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
