<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetScan</title><style>
:root{color-scheme:light dark;--accent:#1473e6;--accent2:#0758b5;--muted:#777;--surface:#1473e60c}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;max-width:1400px;padding:24px;margin:auto}header,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.networks{display:flex;gap:14px;flex-wrap:wrap;margin:26px 0}.scanButton{appearance:none;min-width:190px;min-height:86px;padding:15px 18px;text-align:left;color:white;border:0;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 3px 9px #0003;cursor:pointer;transition:transform .12s,box-shadow .12s}.scanButton:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0004}.scanButton:focus-visible{outline:3px solid #f0b429;outline-offset:3px}.scanButton strong{display:block;font-size:1.08rem;margin-bottom:8px}.scanButton span{display:block;font-family:ui-monospace,monospace;opacity:.88}button.secondary{padding:9px 13px;cursor:pointer}.small{color:var(--muted);font-size:.85rem}.ok{color:#159447;font-weight:650}.warn{color:#bf7800}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{padding:10px 8px;border-bottom:1px solid #8884;text-align:left}dialog{border:1px solid #8886;border-radius:12px;width:min(500px,90vw)}input,textarea{padding:9px;width:100%}label{display:block;margin-top:12px}@media(max-width:800px){body{padding:16px}.scanButton{flex:1 1 160px}table{display:block;overflow:auto}}
</style></head><body><header><div><h1>NetScan</h1><div class="small">Netzwerk auswählen, um den Scan zu starten</div></div><button class="secondary" onclick="location.href='/settings'">⚙ Einstellungen</button></header>
<div class="networks">{% for n in networks %}<button class="scanButton" onclick="scan({{n.id}})" aria-label="{{n.name}} – {{n.range}} scannen"><strong>{{n.name}}</strong><span>{{n.display_range}}</span></button>{% endfor %}</div>
<div id="status" class="small">Bereit.</div><table id="table" hidden><thead><tr><th>Status</th><th>IP</th><th>MAC-Adresse</th><th>Alias</th><th>Hostname</th><th>Hersteller / Typ</th><th>Quelle</th><th></th></tr></thead><tbody id="body"></tbody></table>
<dialog id="dlg"><h3>Gerät bearbeiten</h3><div id="device" class="small"></div><label>Anzeigename / Alias<input id="alias"></label><label>Notizen<textarea id="notes" rows="4"></textarea></label><div class="row" style="margin-top:16px"><button onclick="saveAlias()">Speichern</button><button onclick="deleteAlias()">Alias löschen</button><button onclick="dlg.close()">Abbrechen</button></div></dialog>
<script>
let items=[],networkId=0,current=null; const $=id=>document.getElementById(id); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function scan(id){networkId=id;$('status').textContent='Scan läuft …';$('table').hidden=true;try{const r=await fetch('/scan/'+id,{method:'POST'}),d=await r.json();if(!d.ok)throw Error(d.error);items=d.results;$('status').innerHTML=`<span class="ok">Fertig:</span> ${esc(d.network)} · ${items.length} Geräte`+(d.warnings.length?`<br><span class="warn">Hinweis: ${esc(d.warnings.join(' · '))}</span>`:'');render()}catch(e){$('status').innerHTML='<span class="warn">Fehler: '+esc(e.message)+'</span>'}}
function render(){const body=$('body');body.innerHTML='';for(const [i,x] of items.entries()){const tr=document.createElement('tr');tr.innerHTML=`<td class="ok">● online</td><td>${esc(x.ip)}</td><td>${x.mac?esc(x.mac):'<span class="small">über VPN nicht verfügbar</span>'}</td><td>${x.alias?esc(x.alias):'—'}</td><td>${x.hostname?esc(x.hostname):'—'}</td><td>${esc(x.vendor||'—')}<br><span class="small">${esc(x.device_type)}</span></td><td>${esc(x.source)}</td><td><button onclick="edit(${i})" aria-label="Gerät bearbeiten">✏️</button></td>`;body.appendChild(tr)}$('table').hidden=false}
function edit(i){current=items[i];$('device').textContent=`${current.ip} · ${current.mac||'keine MAC-Adresse'}`;$('alias').value=current.alias||'';$('notes').value=current.notes||'';$('dlg').showModal()}
async function post(url,data){const f=new FormData;for(const [k,v] of Object.entries(data))f.append(k,v);const r=await fetch(url,{method:'POST',body:f}),d=await r.json();if(!d.ok)throw Error(d.error||'Fehler')}
async function saveAlias(){try{await post('/alias/set',{network_id:networkId,identity:current.identity,alias_name:$('alias').value,notes:$('notes').value});current.alias=$('alias').value.trim();current.notes=$('notes').value.trim();$('dlg').close();render()}catch(e){alert(e.message)}}
async function deleteAlias(){if(!confirm('Alias wirklich löschen?'))return;try{await post('/alias/delete',{network_id:networkId,identity:current.identity});current.alias='';current.notes='';$('dlg').close();render()}catch(e){alert(e.message)}}
</script></body></html>
