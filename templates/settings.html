<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetScan – Einstellungen</title><style>
:root{color-scheme:light dark;--accent:#1473e6}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:1200px;margin:auto;padding:24px}.toolbar,.actions,.checks{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:20px}.right{display:flex;gap:10px}button{padding:9px 13px;cursor:pointer}.primary{background:var(--accent);border:0;color:white;border-radius:7px}.icon{font-size:1.2rem;min-width:42px}.small{font-size:.84rem;color:#777}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #8884}.empty{text-align:center;padding:32px;color:#777}dialog{width:min(760px,94vw);border:1px solid #8886;border-radius:14px;padding:22px}dialog::backdrop{background:#0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:.9rem}input,select{width:100%;padding:9px;margin-top:5px}.checks label{display:flex;align-items:center;gap:6px}.checks input{width:auto;margin:0}.router{padding:14px;background:#1473e612;border-radius:9px;margin-top:14px}.dialogActions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.danger{color:#c33}@media(max-width:700px){body{padding:15px}.grid{grid-template-columns:1fr}table{display:block;overflow:auto}}
</style></head><body><div class="toolbar"><div><h1>Scan-Buttons</h1><div class="small">Buttons hinzufügen und bearbeiten</div></div><div class="right"><button onclick="location.href='/'">← Hauptmenü</button><button class="primary icon" onclick="openEditor()" aria-label="Neuen Button hinzufügen">＋</button></div></div><div id="status" class="small"></div>
<table><thead><tr><th>Name</th><th>Darstellung</th><th>Vollständiger IP-Bereich</th><th>Routerintegration</th><th>Aktion</th></tr></thead><tbody id="rows"></tbody></table>
<dialog id="editor"><h2 id="editorTitle">Scan-Button</h2><form onsubmit="event.preventDefault();saveEditor()"><div class="grid"><label>Button-Name<input id="name" required placeholder="z. B. Zuhause"></label><label>IPv4-Bereich<input id="range" required placeholder="192.168.178.0/24"></label><label>TCP-Ping-Ports<input id="ports" value="22,80,443,445,3389"></label><div class="checks"><label><input type="checkbox" id="tcp" checked> TCP-Ping (VPN)</label><label><input type="checkbox" id="rdns" checked> Reverse DNS</label></div></div><div class="router"><label>Optionale Routerintegration<select id="type" onchange="toggleRouter()"><option value="none">Keine</option><option value="fritzbox">FRITZ!Box (TR-064)</option><option value="asus_ssh">ASUS (SSH)</option></select></label><div id="routerFields" class="grid" hidden><label>Router-Adresse<input id="host" placeholder="192.168.178.1"></label><label>Benutzer<input id="user"></label><label>Passwort<input id="password" type="password"></label><label id="portLabel">SSH-Port<input id="routerPort" type="number" min="1" max="65535" value="22"></label></div><p id="routerHelp" class="small"></p></div><div class="dialogActions"><button type="button" onclick="editor.close()">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></dialog>
<script>
let items={{networks|tojson}},editing=-1;const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shortRange(r){if(!r.startsWith('192.168.'))return r;if(r.includes('-'))return r.split('-').map(x=>x.trim().split('.').slice(2).join('.')).join(' – ');return r.split('.').slice(2).join('.')}
function routerName(t){return t==='fritzbox'?'FRITZ!Box (TR-064)':t==='asus_ssh'?'ASUS (SSH)':'Keine'}
function render(){const rows=$('rows');rows.innerHTML='';if(!items.length){rows.innerHTML='<tr><td colspan="5" class="empty">Noch keine Buttons. Mit ＋ einen Button hinzufügen.</td></tr>';return}items.forEach((n,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td><strong>${esc(n.name)}</strong></td><td>${esc(shortRange(n.range))}</td><td><code>${esc(n.range)}</code></td><td>${esc(routerName(n.router_type))}</td><td><button onclick="openEditor(${i})" aria-label="${esc(n.name)} bearbeiten">✏️</button> <button class="danger" onclick="removeItem(${i})" aria-label="${esc(n.name)} löschen">🗑</button></td>`;rows.appendChild(tr)})}
function openEditor(i=-1){editing=i;const n=i>=0?items[i]:{tcp_ping:1,reverse_dns:1,ports:'22,80,443,445,3389',router_type:'none',router_port:22};$('editorTitle').textContent=i>=0?'Scan-Button bearbeiten':'Scan-Button hinzufügen';for(const id of ['name','range','ports','host','user'])$(id).value=n[id==='range'?'range':id==='host'?'router_host':id==='user'?'router_user':id]||'';$('tcp').checked=n.tcp_ping!==0;$('rdns').checked=n.reverse_dns!==0;$('type').value=n.router_type||'none';$('routerPort').value=n.router_port||22;$('password').value='';$('password').placeholder=n.has_router_password?'Gespeichert – leer lassen zum Behalten':'Passwort';toggleRouter();$('editor').showModal();setTimeout(()=>$('name').focus(),0)}
function toggleRouter(){const t=$('type').value;$('routerFields').hidden=t==='none';$('portLabel').hidden=t!=='asus_ssh';$('routerHelp').textContent=t==='fritzbox'?'TR-064 muss erreichbar sein.':t==='asus_ssh'?'SSH muss im ASUS-Router aktiviert sein. Es werden nur DHCP- und Nachbartabellen gelesen.':''}
async function persist(next){const f=new FormData;f.append('payload',JSON.stringify(next));const r=await fetch('/settings/save',{method:'POST',body:f}),d=await r.json();if(!d.ok)throw Error(d.error||'Fehler beim Speichern')}
async function saveEditor(){const n=editing>=0?{...items[editing]}:{};Object.assign(n,{name:$('name').value.trim(),range:$('range').value.trim(),ports:$('ports').value.trim(),tcp_ping:$('tcp').checked,reverse_dns:$('rdns').checked,router_type:$('type').value,router_host:$('host').value.trim(),router_user:$('user').value.trim(),router_password:$('password').value,router_port:Number($('routerPort').value)||22});const next=[...items];if(editing>=0)next[editing]=n;else next.push(n);try{await persist(next);items=next;$('editor').close();$('status').textContent='Gespeichert ✓';setTimeout(()=>location.reload(),350)}catch(e){$('status').textContent='Fehler: '+e.message}}
async function removeItem(i){if(!confirm(`„${items[i].name}“ wirklich löschen?`))return;const next=items.filter((_,x)=>x!==i);try{await persist(next);items=next;$('status').textContent='Gelöscht ✓';render()}catch(e){$('status').textContent='Fehler: '+e.message}}
render();
</script></body></html>
