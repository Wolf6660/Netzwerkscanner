<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetScan – Einstellungen</title><style>
:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;max-width:1200px;margin:auto;padding:24px}.toolbar,.checks{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{border:1px solid #8885;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:.9rem}input,select{box-sizing:border-box;width:100%;padding:9px;margin-top:5px}.checks label{display:flex;align-items:center;gap:6px}.checks input{width:auto;margin:0}button{padding:9px 13px;cursor:pointer}.small{font-size:.84rem;color:#777}.router{padding:12px;background:#1473e612;border-radius:8px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>Netzwerke</h1><div class="toolbar"><button onclick="location.href='/'">← Hauptmenü</button><button onclick="add()">+ Netzwerk</button><button onclick="save()">💾 Speichern</button></div><p class="small">Jedes Netzwerk erscheint als eigener Button. Die Routerintegration ist optional. Ein leeres Passwortfeld behält ein bereits gespeichertes Passwort bei.</p><div id="status" class="small"></div><div id="cards"></div>
<script>
const initial={{networks|tojson}},cards=document.getElementById('cards'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(n={}){const el=document.createElement('section');el.className='card';el.dataset.id=n.id||'';el.innerHTML=`<div class="grid"><label>Button-Name<input class="name" value="${esc(n.name)}" placeholder="z. B. Zuhause"></label><label>IPv4-Bereich<input class="range" value="${esc(n.range)}" placeholder="192.168.1.0/24"></label><label>TCP-Ping-Ports<input class="ports" value="${esc(n.ports||'22,80,443,445,3389')}"></label><div class="checks"><label><input type="checkbox" class="tcp" ${n.tcp_ping!==0?'checked':''}> TCP-Ping (VPN)</label><label><input type="checkbox" class="rdns" ${n.reverse_dns!==0?'checked':''}> Reverse DNS</label></div></div><div class="router"><label>Optionale Routerintegration<select class="type" onchange="toggle(this)"><option value="none">Keine</option><option value="fritzbox" ${n.router_type==='fritzbox'?'selected':''}>FRITZ!Box (TR-064)</option></select></label><div class="routerFields grid" ${n.router_type==='fritzbox'?'':'hidden'}><label>FRITZ!Box-Adresse<input class="host" value="${esc(n.router_host)}" placeholder="192.168.178.1"></label><label>FRITZ!Box-Benutzer<input class="user" value="${esc(n.router_user)}"></label><label>Passwort<input class="password" type="password" placeholder="${n.has_router_password?'Gespeichert – leer lassen zum Behalten':'Passwort'}"></label></div></div><button style="margin-top:12px" onclick="this.closest('.card').remove()">🗑 Netzwerk entfernen</button>`;cards.appendChild(el)}
function toggle(s){s.closest('.router').querySelector('.routerFields').hidden=s.value!=='fritzbox'}function add(){card({tcp_ping:1,reverse_dns:1})}initial.forEach(card);if(!initial.length)add();
async function save(){const data=[...document.querySelectorAll('.card')].map(x=>({id:x.dataset.id||null,name:x.querySelector('.name').value,range:x.querySelector('.range').value,ports:x.querySelector('.ports').value,tcp_ping:x.querySelector('.tcp').checked,reverse_dns:x.querySelector('.rdns').checked,router_type:x.querySelector('.type').value,router_host:x.querySelector('.host').value,router_user:x.querySelector('.user').value,router_password:x.querySelector('.password').value}));const f=new FormData;f.append('payload',JSON.stringify(data));document.getElementById('status').textContent='Speichere …';const r=await fetch('/settings/save',{method:'POST',body:f}),d=await r.json();document.getElementById('status').textContent=d.ok?'Gespeichert ✓':'Fehler: '+d.error;if(d.ok)setTimeout(()=>location.reload(),500)}
</script></body></html>
